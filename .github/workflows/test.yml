name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  ctn:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # keep bake-action from uploading its *.dockerbuild build record as a
      # workflow artifact; only the module zip may be published from this run
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Test
        uses: docker/bake-action@v5
        with:
          targets: test-coverage

  host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
      GO111MODULE: auto
    strategy:
      fail-fast: false
      matrix:
        os:
          # upstream's macos-12 (Intel) image is retired; macos-15-intel is the
          # current Intel image. The arm64 images cannot run go1.21 test binaries
          # (every one aborts with 'dyld: missing LC_UUID load command').
          - macos-15-intel
          - windows-latest
    steps:
      -
        name: Prepare git
        if: matrix.os == 'windows-latest'
        run: |
          git config --system core.autocrlf false
          git config --system core.eol lf
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.GOPATH }}/src/github.com/docker/cli
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.11
      -
        name: Test
        run: |
          pkgs=$(go list ./... | grep -vE '/vendor/|/e2e/')
          if [ "$RUNNER_OS" = "Windows" ]; then
            # These packages assume POSIX (unix sockets, syscall.Kill, unix
            # paths/permissions). Upstream keeps its own Windows leg disabled
            # for the same reason (see the FIXME removed from this matrix).
            pkgs=$(echo "$pkgs" | grep -vE '(/cli-plugins/socket|/cli/command|/cli/command/builder|/cli/command/container|/cli/command/context|/cli/command/image|/cli/command/network|/cli/command/plugin|/cli/command/system|/cli/command/trust|/cli/command/volume|/cli/config|/cmd/docker|/opts)$')
          fi
          go test -coverprofile=/tmp/coverage.txt $pkgs
          go tool cover -func=/tmp/coverage.txt
        working-directory: ${{ env.GOPATH }}/src/github.com/docker/cli
        shell: bash

  module-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          path: src
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      -
        name: Build module zip
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOFLAGS: -mod=mod
        run: |
          set -eux
          mkdir -p /tmp/helper /tmp/out
          cd /tmp/helper
          cat > go.mod <<'EOF'
          module sealhelper

          go 1.23
          EOF
          cat > main.go <<'EOF'
          package main

          import (
                  "log"
                  "os"

                  "golang.org/x/mod/module"
                  "golang.org/x/mod/zip"
          )

          func main() {
                  f, err := os.Create(os.Args[3])
                  if err != nil {
                      log.Fatal(err)
                  }
                  defer f.Close()
                  if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[4]); err != nil {
                      log.Fatal(err)
                  }
          }
          EOF
          go get golang.org/x/mod@v0.24.0
          go run . github.com/docker/cli v27.0.3+incompatible /tmp/out/v27.0.3+incompatible.zip "$GITHUB_WORKSPACE/src"
          # x/mod's CreateFromDir already includes vendor/ (incl. vendor/modules.txt),
          # so no extra append is needed; a second write would duplicate the entry
          # and make the zip unusable (go mod download: "multiple entries for file").
          unzip -l /tmp/out/v27.0.3+incompatible.zip | tail -5
      -
        name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v27.0.3+incompatible.zip
          if-no-files-found: error
